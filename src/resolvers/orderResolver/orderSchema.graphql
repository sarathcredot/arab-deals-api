scalar Upload
scalar ObjectId
scalar Date


# User Order  Mutations

type Mutation {
    createUserOrder(input: CreateUserOrderInput!): CreateUserOrderResponse!
    updateAdminOrderProduct(input: UpdateAdminOrderProductInput!, invoice:Upload): UpdateAdminOrderProductResponse!
    returnUserOrderProduct(input: ReturnUserOrderProductInput!): ReturnUserOrderProductResponse!
    cancelUserOrderProduct(input: CancelUserOrderProductInput!): CancelUserOrderProductResponse!

}


# Create Order Input

input CreateUserOrderInput {
    shippingAddressId: ObjectId!
    paymentMode: String!
    grandTotal: Float!
}

input UpdateAdminOrderProductInput {
   _id: ObjectId!
   paymentRemark: String
   paymentStatus: String
   shippingStatus: String
   shippedDate: Date
   deliveryDate: Date
   returnStatus: String
   returnUserReason: String
   returnAdminComment: String
   returnRequestDate: Date
   returnDate: Date
   returnRejectedDate: Date
   refundStatus: String
   refundAmount: Float
   refundRequestDate: Date
   refundDate: Date
   refundComment: String
   cancelUserReason: String
   cancelAdminComment: String
   cancelledDate: Date
   courierId: String
   invoiceNumber: String
}

input ReturnUserOrderProductInput {
    _id: ObjectId!
    returnUserReason: String!
}

input CancelUserOrderProductInput {
    _id: ObjectId!
}

type CreateUserOrderResponse {
    orderId:String!
}

type UpdateAdminOrderProductResponse {
   _id: ObjectId
}

type ReturnUserOrderProductResponse {
   _id: ObjectId
}

type CancelUserOrderProductResponse {
    _id: ObjectId
}




