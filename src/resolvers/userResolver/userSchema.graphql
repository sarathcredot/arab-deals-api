type userBlockResponse{
  message:String
}

type userLoginOtpResponse {
  message: String!
  mobileNumber:String!
  _id: ObjectId!
  }

type userLoginOtpInMobileResponse {
  message: String!
  mobileNumber:String!
  _id: ObjectId!
  }

type userVerifyOtpResponse {
  userId: String
  token: String
  message:String
  }

 type userVerifyOtpInMobileResponse {
  userId: String
  token: String
  message:String
  } 
type userSignUpResponse {
    _id: String
    message: String
