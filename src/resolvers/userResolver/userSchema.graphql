# user auth Mutations

 type Mutation {
  userLoginOtp(input: userLoginOtpInput!): userLoginOtpResponse!
  userVerifyOtp(input:userVerifyOtpInput!): userVerifyOtpResponse!
  userBlock(input:userBlockInput!):userBlockResponse!
  updateUserProfile(input:updateUserProfileInput!):updateUserProfileResponse!
}

# user auth query

type Query{
  getUsersByAdmin(input:userFilters):usersResponse!
  getUserRecordByAdmin(input:userInput!):userResponse!
}

# user auth Input

input userLoginOtpInput {
  mobileNumber: String!
}
input userBlockInput {
  _id: String!
  isBlocked:Boolean!
}

input userFilters{
  page: Int
  size: Int
  isBlocked:Boolean
  query: String
}

input userVerifyOtpInput {
  code: String!
}

input updateUserProfileInput {
  _id: String!
  email: String
  firstName: String
  lastName: String
  displayName: String
  address: String
  countryCode: String
  mobileNumber: String
  # password: String
  isBlocked: Boolean
}

input userInput{
  _id: String!
}    

# user auth Output

type userBlockResponse{
  message:String
}

type userLoginOtpResponse {
  message: String!
  mobileNumber:String!
  }
type userVerifyOtpResponse {
  userId: String
  token: String
  message:String
  }
type userSignUpResponse {
    _id: String
    message: String
    token: String
  }

type user{
  _id:String
  email: String
  firstName: String
  lastName: String
  displayName: String
  address: String
  countryCode: String
  mobileNumber: String
  hash: String
  isBlocked: Boolean
  token: String
}

type usersResponse {
    maxRecords: Int!
    records: [user!]
}

type updateUserProfileResponse {
   _id: String
   message: String
}

type userResponse{
  record: user
  message: String
}
  
# Schema

schema {
mutation: Mutation,
}


