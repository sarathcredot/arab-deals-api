scalar ObjectId

# user auth Mutations

 type Mutation {
  userLoginOtp(input: userLoginOtpInput!): userLoginOtpResponse!
  userVerifyOtp(input:userVerifyOtpInput!): userVerifyOtpResponse!
  userBlock(input:userBlockInput!):userBlockResponse!
  updateUserProfile(input:updateUserProfileInput!):updateUserProfileResponse!
  updateUserProfileByAdmin(input:UpdateUserProfileByAdminInput!):UpdateUserProfileByAdminResponse!
  logoutUser:UserLogoutResponse!
  accountDeleteByUser(input:accountDeleteByUserInput!):accountDeleteByUserResponse!

  # Mobile API
    userLoginOtpInMobile(input: userLoginOtpInMobileInput!): userLoginOtpInMobileResponse!
    userVerifyOtpInMobile(input:userVerifyOtpInMobileInput!): userVerifyOtpInMobileResponse!
    updateUserProfileInMobile(input:updateUserProfileInMobileInput!):updateUserProfileInMobileResponse!
    logoutMobileUser:LogoutMobileUserResponse!

}

# user auth query

type Query{
  getUsersByAdmin(input:userFilters):usersResponse!
  getUserRecordByAdmin(input:userInput!):userResponse!
  getUserRecord:GetUserRecordResponse!

  # Mobile API
  getUserRecordInMobile:GetUserRecordInMobileResponse!
}
                  
# user auth Input

input accountDeleteByUserInput{
   isDeleted:Boolean!
   deleteReason:String
}

type accountDeleteByUserResponse{
  success:Boolean
  message:String
}

input userLoginOtpInput {
  mobileNumber: String!
  countryCode:String!
}

input userLoginOtpInMobileInput {
  mobileNumber: String!
  countryCode:String!

}

input userBlockInput {
  _id: String!
  isBlocked:Boolean!
}

input userFilters{
  page: Int
  size: Int
  isBlocked:Boolean
  isDeleted:Boolean
  query: String
}

input userVerifyOtpInput {
  code: String!
  _id: ObjectId!
}

input userVerifyOtpInMobileInput {
  code: String!
  _id: ObjectId!
}


input updateUserProfileInput {
  email: String
  firstName: String
  lastName: String
  displayName: String
}

input UpdateUserProfileByAdminInput {
  _id: ObjectId
  email: String
  firstName: String
  lastName: String
  displayName: String
  mobileNumber: String
  isBlocked: Boolean
}

input updateUserProfileInMobileInput {
  email: String
  firstName: String
  lastName: String
  displayName: String
}


input userInput{
  _id: String!
} 

