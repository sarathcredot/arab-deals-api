scalar Upload
scalar JSONObject

# KYC  Mutations

type Mutation {
  # submitKYC(input: kycDataInput!, images:[Upload]): SubmitKYCResponse!
  submitKycCompanyDetails(input: KycCompanyDetailsInput!, image: Upload): SubmitKycCompanyDetailsResponse!
  submitKycBusinessOutletDetails(input: KycBusinessOutletDetailsInput!, images: [Upload], fileMap: JSONObject): SubmitKycBusinessOutletDetailsResponse!
  submitKycSellingProductDetails(input: KycSellingProductDetailsInput!, images: [Upload]): KycSellingProductDetailsResponse!
  updateIsKycCompleted: UpdateIsKycCompletedResponse
}

#   KYC  Type

type ImageData {
  fileType: String
  fileURL: String
  mimeType: String
  originalName: String
}

type CompanyDetailsData {
  _id: String
  sectionName: String
  name: String
  type: String
  crNumber: String
  crLicence: String
  status: String
  remarks: [String]
  companyLicenceImage: ImageData
}

type sellingProductData {
   _id: String
  sectionName: String
  discription: String
  brand: String
  status: String
  remarks: [String]
  sellingProductImage: [ImageData]
}

type businessOutletData {
   _id: String
  sectionName: String
  name: String
  address: String
  interiorImage: ImageData
  exteriorImage: ImageData
  status: String
  remarks: [String]
}

type KYCRecord {
  _id: String
  vendorId: String
  companyDetails: CompanyDetailsData
  businessOutlet: businessOutletData
  sellingProduct: sellingProductData  
  isKycCompleted: Boolean
}

type KYCRecordWithVendorDetails {
  _id: String
  vendorId: String
  fullName: String
  companyDetails: CompanyDetailsData
  businessOutlet: businessOutletData
  sellingProduct: sellingProductData  
  isKycCompleted: Boolean
}

type SubmitKycCompanyDetailsResponse {
  _id: String
  message: String
}

type SubmitKycBusinessOutletDetailsResponse {
  _id: String
  message: String
}

type KycSellingProductDetailsResponse {
  _id: String
  message: String
}

type UpdateIsKycCompletedResponse {
  message: String
}


