  getSettlementHistoryByAdmin:[Settlement]!
  getAllAssignOrderAgentProfile:GetAllAssignOrderAgentProfileResponse!
 
   getAssignedeOrderDeatilsByAgentProfile(input:getAssignedeOrderDeatilsByAgentProfileInput!):GetAssignedOrderDetailByDeliveryAgentResponseArry!
   getAssignedOrderByAgentProfile(input:getAssignedOrderByAgentProfileInput):getAssignedOrderByAgentProfileResponse!
   getTodayAssignedOrderByAgentProfile(input:getAssignedOrderByAgentProfileInput):getAssignedOrderByAgentProfileResponse!
   getAssignedOrderByDeliveryAgent(input:GetAssignedOrderByDeliveryAgentInput):GetAssignedOrderByDeliveryAgentResponse!
   getAssignedOrderBundleByDeliveryAgent(input:GetAssignedOrderByDeliveryAgentInput):GetAssignedOrderBundleByDeliveryAgentResponse!
   getAssignedReturnOrderBundleByDeliveryAgent(input:GetAssignedOrderBundleInput):GetAssignedOrderBundleByDeliveryAgentResponse!
   getAssignedWarrantyCallDeliveryAgent(input:getAssignedWarrantyCallDeliveryAgentInput!):getAssignedWarrantyCallDeliveryAgentResponse!
