scalar ObjectId


type Mutation {
  
  editDeliveryAgentData(input:EditAgentDataInput!):Boolean!
  createDeliveryAgent(input: CreateDeliveryAgentInput!): CreateDeliveryAgentResponse!
  suspendDeliveryAgent(input: SuspendDeliveryAgentInput!):CreateDeliveryAgentResponse!
  loginDeliveryAgent(input:LoginDeliveryAgentInput):LoginDeliveryAgentResponse!
  createSettlement(input:CreateSettlementInput!):CreateDeliveryAgentResponse!
  

  }






type Query{
  
  getAllAgentData:[AllAgents]!
  getDeliveryAgent(input: SuspendDeliveryAgentInput!): DeliveryAgent
    
}


type AllAgents{

    _id:ObjectId!
    fullName:String!
    contactNumber:String!
    userID:String!
    password:String!
    agentType:String!
    isActive:Boolean!
    vendorID:ObjectId

}

type DeliveryAgent{
    _id:ObjectId!
    fullName:String!
    contactNumber:String!
    userID:String!
    agentType:String!
    isActive:Boolean!
    vendorID:ObjectId
}



# Response type for createDeliveryAgent Mutation
type CreateDeliveryAgentResponse {
  _id: ObjectId
  message: String!
}
 
# Input type for creating a Delivery Agent
input CreateDeliveryAgentInput {
  fullName: String!
  contactNumber: String!
  userID: String!
  password: String!
  agentType: String! # Must be one of: 'ArabDeals', 'Vendor', 'ThirdParty'
  vendorID: ObjectId # Optional, only for agents linked to a vendor
}

input CreateSettlementInput {
  agentId: ObjectId!
  amount: Float!
  date: Date!
  remarks: String
}


input SuspendDeliveryAgentInput {
  agentId:ObjectId!
  isActive:Boolean!
}



input EditAgentDataInput{

    _id:ObjectId!
    fullName:String!
    contactNumber:String!
    userID:String!
    agentType:String!
    vendorID:ObjectId

}

input LoginDeliveryAgentInput{
   
    userID:String!
    contactNumber:String!
    password:String!
}

type LoginDeliveryAgentResponse{

      status:String!
      fullName:String!
      token:String!
      msg:String!
}





# Schema

schema {
  mutation: Mutation
  query: Query
}



