scalar ObjectId





type Mutation {
  
  editDeliveryAgentData(input:EditAgentDataInput!):Boolean!
   createDeliveryAgent(input: CreateDeliveryAgentInput!): CreateDeliveryAgentResponse!
  suspendDeliveryAgent(input: SuspendDeliveryAgentInput!):CreateDeliveryAgentResponse!
  

  }






type Query{
  
  getAllAgentData:[AllAgents]!
  getDeliveryAgent(input: SuspendDeliveryAgentInput!): DeliveryAgent
    
}







type AllAgents{

    _id:ObjectId!
    fullName:String!
    contactNumber:String!
    userID:String!
    password:String!
    agentType:String!
    isActive:Boolean!
    vendorID:ObjectId

}

type DeliveryAgent{
    _id:ObjectId!
    fullName:String!
    contactNumber:String!
    userID:String!
    agentType:String!
    isActive:Boolean!
    vendorID:ObjectId
}



# Response type for createDeliveryAgent Mutation
type CreateDeliveryAgentResponse {
  _id: ObjectId
  message: String!
}
 
# Input type for creating a Delivery Agent
input CreateDeliveryAgentInput {
  fullName: String!
  contactNumber: String!
  userID: String!
  password: String!
  agentType: String! # Must be one of: 'ArabDeals', 'Vendor', 'ThirdParty'
  vendorID: ObjectId # Optional, only for agents linked to a vendor
}


input SuspendDeliveryAgentInput {
  agentId:ObjectId!
}


 


input EditAgentDataInput{

    _id:ObjectId!
    fullName:String!
    contactNumber:String!
    userID:String!
    agentType:String!
    vendorID:ObjectId

}








# Schema

schema {
  mutation: Mutation
  query: Query
}



