   getAssignedReturnOrderByAgent(input: GetAssignedReturnOrderInput!):GetDeliveryAgentReturnOrderResponse!
   getPendingReturnsByAgent(input: GetAssignedReturnOrderInput!):GetDeliveryAgentReturnOrderResponse!
   getDeliveryAgentlistCustomizOrderAssigen(input:getDeliveryAgentlistCustomizOrderAssigenInput):[getDeliveryAgentlistCustomizOrderAssigenResponse]!
   getLocationsData:[Locations]!
   getDeliveryAgentWarrantyCall(input:getDeliveryAgentWarrantyCallInput!):getDeliveryAgentWarrantyCallResponse!
   getPendingWarrantyPickupsByAgent(input:getPendingWarrantyPickupsByAgentInput):getPendingWarrantyPickupsByAgentResponse
