

# Product Mutations

  scalar JSONObject
  scalar Upload

  type File {
    filename: String!
    mimetype: String!
    encoding: String!
  }

  type Mutation {
    uploadProductFile(file: Upload!): File
    createProduct(input: ProductInput!, images:[Upload], attributeFileMap: JSONObject): ProductResponse
    createVariant(input: VariantInput!, images:[Upload], attributeFileMap: JSONObject): VariantResponse
    updateProduct(input: ProductUpdateInput!, images: [Upload], attributeFileMap: JSONObject): ProductUpdateResponse
    deleteProduct(input: ProductId!): DeleteProductResponse!
  }


    # Input

    input ProductFileDataInput {
    fileType: String
    fileURL: String
    mimeType: String
    originalName: String
    }

   input ProductInput {
    vendorId: String!
    brandId: String
    brandName: String
    productName: String
    shortDescription: String
    skuId: String
    description: String
    productInfo: [String]
    productShortInfo: String
    color: String
    size: String
    material: String,
    rating: Int
    tags: String
    sellingPrice: Float
    price: Float
    mrp: Float
    isBlocked: Boolean
    productCode: Int
    stock: Int
    categoryId: String!
    images: [String]
    status: String
    offerPrice: Int!
}

