  scalar Upload
  scalar ObjectId

# Brand Mutations


  type Mutation {
    addBrand(input: AddBrandInput!, image:Upload): AddBrandResponse!
    updateBrand(input: updateBrandInput!, , image:Upload): updateBrandResponse!
    deleteBrand(input: BrandIdInput!): BrandDeleteRecordResponse!
  }


    # Input

    input AddBrandInput {
        brandName:String!
        isBlocked: Boolean
        isPopular: Boolean
        priority: Int!
    }   

    input updateBrandInput {
          _id: String!
        brandName: String
        isBlocked: Boolean
        isPopular: Boolean
        priority: Int
        categories: [String]
    }

    input BrandRecordIdInput {
      _id: String
    }

    input BrandsDetailsWithCategoryIdInput {
      categoryId: ObjectId
    }

    input BrandsDetailsWithCategoryIdInMobileInput {
      categoryId: ObjectId
    }

    # Output

    type AddBrandResponse {
        _id: String!
        message: String
    }  

    type updateBrandResponse {
        _id: String!
        message: String
    }

    type BrandDeleteRecordResponse {
      _id: String!
      message: String
    }
     
    type BrandRecordId {
      _id: String
    }

    # type BrandsWithCategory{
    #   _id: String,
