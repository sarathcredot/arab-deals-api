scalar ObjectId
scalar Upload


type Mutation {
   createCouponsByAdmin(input:CreateCouponsByAdminInput!):CreateCouponsByAdminResponse
   adminSuspendTheCupone(input:adminSuspendTheCuponeInput):adminSuspendTheCuponeResponse!
   editCouponsByAdmin(input:EditCouponsByAdminInput!):CreateCouponsByAdminResponse
   applyCouponByUser(input:applyCouponByUserInput!):ApplyCouponsByAdminResponse!
}

type Query{
      getAllCoupenToAdmin(input:getAllCoupenToAdminInput!):getAllCoupenToAdminResponse!
}


input Categoryvalid {
  category: ObjectId
}

input Productvalid {
  product: ObjectId
}

input Uservalid {
  user: ObjectId
}

input Brandvalid{
  brand:ObjectId
}


input CreateCouponsByAdminInput{
    name:String!
    code:String!
    description:String
    # couponType: String!
    orderCount:Int
    discountType: String!
    couponApplicableType: String
    discountValue: Float
    max_discount: Float
    minOrderAmount: Float
    validCategories: [Categoryvalid]
    validProducts: [Productvalid]
    validUsers: [Uservalid]
    validBrands: [Brandvalid]
    usageLimit: Int
    usagePerUserLimit: Int
    startDate: Date
    expiryDate: Date
}

input EditCouponsByAdminInput{
    _id:ObjectId!
    name:String
    code:String
    description:String
    # couponType: String!
    orderCount:Int
    discountType: String
    couponApplicableType: String
    discountValue: Float
    max_discount: Float
    minOrderAmount: Float
    validCategories: [Categoryvalid]
    validProducts: [Productvalid]
    validUsers: [Uservalid]
    validBrands: [Brandvalid]
    usageLimit: Int
    usagePerUserLimit: Int
    startDate: Date
    expiryDate: Date
}

input applyCouponByUserInput{
  userId:ObjectId!
  couponId:ObjectId
  code:String
  grandTotal:Float!
  subTotal:Float!
  shippingCharge:Float
}

type CreateCouponsByAdminResponse{
    success:Boolean
    message:String
}

type ApplyCouponsByAdminResponse{
  success:Boolean
  message:String
  subtotal: Float,
  grandTotal: Float,
  discount: Float,
  shippingCharge: Float
}



input adminSuspendTheCuponeInput{

     _id:ObjectId,
     isActive:Boolean
}

type adminSuspendTheCuponeResponse{

      status:Boolean,
      msg:String
}


type getAllCoupenToAdminResponse{

      records: [Coupon ],
     maxRecords: Int
}

input getAllCoupenToAdminInput{

    page:Int
    size:Int
    isActive:Boolean
    startDate:Date
    expiryDate:Date


}

type Coupon{

     name:String 
     code:String
     description:String
     couponType:String
     discountType:String
     couponApplicableType:String
     discountValue:Int
     max_discount:Int
     minOrderAmount:Int
     validCatogories:[ValidCategory]
     validProducts:[ValidProduct]
     validUsers:[ValidUser]
     usageLimit:Int
     usagePerUserLimit:Int
     startDate:Int
     expiryDate:Date 
     isActive:Boolean
     userUsage:[UserUsageLimit]
}


type ValidCategory {
 
 catogory:ObjectId
 
}

type ValidProduct {
    products:ObjectId
}

type ValidUser {
   
    user:ObjectId
}

type UserUsageLimit {
  userId: ObjectId
  usageCount: Int
}


schema {
  mutation: Mutation
  query: Query
}