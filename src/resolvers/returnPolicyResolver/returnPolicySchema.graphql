scalar ObjectId
scalar Upload


type Mutation {
   createReturnPolicyBySuperAdmin(input:createReturnPolicyBySuperAdminInput!):createReturnPolicyBySuperAdminResponse
   updateReturnPolicyByAdmin(input:updateReturnPolicyByAdminInput):updateReturnPolicyByAdminResponse
   deleteReturnPolicyByAdmin(input:deleteReturnPolicyByAdminInput!):deleteReturnPolicyByAdminResponse
   updateStatusReturnPolicyByAdmin(input:updateStatusReturnPolicyByAdminInput!):updateStatusReturnPolicyByAdminResponse
}

type Query {
  getAllPoliciesBySuperAdmin(input:getAllPoliciesBySuperAdminInput):getAllPoliciesBySuperAdminResponse
  getReturnPolicyByAdmin(input:getReturnPolicyByAdminInput!):getReturnPolicyByAdminResponse
  getDefaultReturnPolicyInCategory(input:getDefaultReturnPolicyInCategoryInput!):Boolean!
  getDefaultReturnPolicyInProduct(input:getDefaultReturnPolicyInProductInput!):Boolean!
}



input getDefaultReturnPolicyInProductInput{

       brandId:ObjectId
       categoryId:ObjectId

}


input getDefaultReturnPolicyInCategoryInput{

      id:ObjectId
}






input createReturnPolicyBySuperAdminInput {
     name:String!
