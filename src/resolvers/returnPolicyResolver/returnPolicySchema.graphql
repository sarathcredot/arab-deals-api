     search:String
     isEnable:Boolean
}

input getReturnPolicyByAdminInput{
  returnPolicyId:ObjectId!
}

input updateReturnPolicyByAdminInput{
  returnPolicyId:ObjectId!
  name:String
  description:String
  duration: Int
  returnCharge:Int
}

input deleteReturnPolicyByAdminInput{
   returnPolicyId:ObjectId!
}

input updateStatusReturnPolicyByAdminInput{
