# Outlet Mutations


  type Mutation {
    addVendorOutlet(input: AddVendorOutletInput!, images:[Upload], fileMap: JSONObject): AddVendorOutletResponse!
    updateVendorOutlet(input: UpdateVendorOutletInput!, images:[Upload], fileMap: JSONObject): UpdateVendorOutletResponse!
    updateVendorOutletByAdmin(input: UpdateVendorOutletByAdminInput!,outletLicense:Upload,interiorImage: Upload, exteriorImage:Upload): UpdateVendorOutletByAdminResponse!

  }




   # Type

  type ImageData {
    fileType: String
    fileURL: String
    mimeType: String
    originalName: String
  }  

   type VendorOutlet {
        _id: String
        vendorId: String
        outletName:String
        country:String
        district: String
        village: String
        address: String
        contactPersonName: String
        contactPersonNumber: String
        contactPersonDesignation: String
        status: String
        remarks: [String]
        outletLicense: ImageData
        interiorImage: ImageData
        exteriorImage: ImageData
    }  

    type vendorOutletRecordsWithKycData {
      vendorId: String
      fullName: String
      isKycCompleted: String
      _id: String
      outletName: String
      status: String
      country: String
      district: String
      village: String
      address: String
      contactPersonName: String
      contactPersonNumber: String
      contactPersonDesignation: String
      remarks: [String]
    }


    # Input

    input AddVendorOutletInput {
        outletName:String!
        country:String!
        district: String!
        village: String!
        address: String!
        contactPersonName: String!
        contactPersonNumber: String!
        contactPersonDesignation: String!
    }   

    input UpdateVendorOutletInput {
        outletName:String
        country:String
        district: String
        village: String
        address: String
        contactPersonName: String
        contactPersonNumber: String
        contactPersonDesignation: String
    }

    input UpdateVendorOutletByAdminInput {
      _id: ObjectId!
      outletName:String
      country:String
      district: String
      village: String
      address: String
      contactPersonName: String
      contactPersonNumber: String
      contactPersonDesignation: String
      status: String
