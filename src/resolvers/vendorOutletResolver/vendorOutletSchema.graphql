    }



    input DeleteVendorOutletIdInput {
      _id: String!
    }

    input VendorOutletStatusUpdationInput {
      _id: String!
      status: String!
      remarks: [String]
    } 

    # Output

    type AddVendorOutletResponse {
        _id: String!
        message: String
    }  

    type UpdateVendorOutletResponse {
        message: String
    }

    type DeleteVendorOutletRecordResponse {
      _id: String!
      message: String
    }
 
   type UpdateVendorOutletByAdminResponse {
        message: String
  }


# Outlet Queries

  type Query {
    getAllVendorOutletRecordsByAdmin(input: VendorOutletRecordsByAdminFilter): VendorOutletRecordsByAdminResponse!
    getVendorOutletRecordByAdmin(input: VendorOutletRecordByAdminInput!): VendorOutletRecordByAdminResponse!
    getVendorOutletRecord: VendorOutletRecordResponse!

  }   

    # Input
   
  input VendorOutletRecordByAdminInput {
    _id: String!
  }

  input VendorOutletRecordsByAdminFilter {
    page: Int
    size: Int
    status: String
    vendorId:ObjectId
    outletName:String
    fullName:String
  }

    # Output

    type ImageData {
    fileType: String
    fileURL: String
    mimeType: String
    originalName: String
  }    

  type VendorOutletRecordByAdminResponse {
    record: VendorOutlet!
    message: String
  }

  type VendorOutletRecordResponse {
    record: VendorOutlet!
    message: String
  }

  type VendorOutletRecordsByAdminResponse {
    maxRecords: Int!
    records: [vendorOutletRecordsWithKycData!]
    message: String
  }

  type VendorOutletStatusUpdationResponse {
    _id: String
