# User Shipping Address  Queries

type Query {
    getUserShippingAddresses: GetUserShippingAddressesResponse!
    getUserShippingAddress(input:GetUserShippingAddressInput!): GetUserShippingAddressResponse!
    getUserDefaultShippingAddress: GetUserShippingAddressResponse!

    # mobile
    getMobileUserShippingAddresses: GetMobileUserShippingAddressesResponse!
    getMobileUserShippingAddress(input:GetMobileUserShippingAddressInput!): GetMobileUserShippingAddressResponse!
    getMobileUserDefaultShippingAddress: GetMobileUserDefaultShippingAddressResponse!


}


input GetUserShippingAddressInput {
    _id: ObjectId!  
}

input GetMobileUserShippingAddressInput {
    _id: ObjectId!  
}

