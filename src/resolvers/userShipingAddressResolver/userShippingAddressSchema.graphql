scalar Upload
scalar ObjectId


# User Shipping Address  Mutations

type Mutation {
    createUserShippingAddress(input: UserCreateShippingAddressInput!): UserCreateShippingAddressResponse!
    editUserShippingAddress(input: UserEditShippingAddressInput!): UserEditShippingAddressResponse!
    removeUserShippingAddress(input: UserRemoveShippingAddressInput!): UserRemoveShippingAddressResponse!
    updateUserShippingAddressAsDefault(input: updateUserShippingAddressAsDefaultInput!): updateUserShippingAddressAsDefaultResponse!

    # Mobile
    createMobileUserShippingAddress(input: CreateMobileUserShippingAddressInput!): CreateMobileUserShippingAddressResponse!
    editMobileUserShippingAddress(input: EditMobileUserShippingAddressInput!): EditMobileUserShippingAddressResponse!
    removeMobileUserShippingAddress(input: RemoveMobileUserShippingAddressInput!): RemoveMobileUserShippingAddressResponse!
    updateMobileUserShippingAddressAsDefault(input: UpdateMobileUserShippingAddressAsDefaultInput!): UpdateMobileUserShippingAddressAsDefaultResponse!
}


# Shipping Address Input

input UserCreateShippingAddressInput {
    firstname: String!
    email: String
    mobile: String!
    streetName: String!
    city: String!
    houseNumber: String!
    country: String
    postCode: String!
    apartment: String
    suite: String
    unit: String
    governorate:String!
    village:String!
    isDefault: Boolean
}

input CreateMobileUserShippingAddressInput {
    firstname: String!
    email: String
    mobile: String!
    streetName: String!
    city: String!
    houseNumber: String!
    country: String
    postCode: String!
    apartment: String
    suite: String
    unit: String
    isDefault: Boolean
}


