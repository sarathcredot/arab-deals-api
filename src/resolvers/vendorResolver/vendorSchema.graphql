# Vendor  Mutations

type Mutation {
  sendOtp(input: sendOtpInput!): sendOtpResponse!
  createVendor(input: VendorSignUpInput!, image:Upload): CreateVendorResponse!
  createVendorByAdmin(input: VendorSignUpByAdminInput!, image:Upload): CreateVendorByAdminResponse!
  loginVendorWithOtp(input: VendorLoginInput!): VendorLoginResponse!
  reSendloginVendorWithOtp(input: VendorLoginInput!): VendorLoginResponse!
  verifyVendorLoginOtp(input: VerifyVendorLoginOtpInput!): VerifyVendorLoginOtpResponse!
  vendorKycApproval(input: VendorKycStatusInput!): VendorKycStatusResponse!
  updateVendorProfile(input: VendorEditProfileInput!,image: Upload): UpdateVendorResponse!
  updateVendorProfileByAdmin(input: VendorEditProfileByAdminInput!,image: Upload): UpdateVendorByAdminResponse!
  logoutVendor:LogoutVendorResponse!

}

