scalar Upload

# Vendor auth Mutations

type Mutation {
  verifyTempVendor(input: VerifyTempVendorInput!): VerifyTempVendorResponse!
  loginVendor(input: VendorLoginInput!): VendorAuthResponse!
  updateVendorProfile(input: VendorEditProfileInput!, image: Upload): UpdateVendorResponse!
}

type ImageData {
  fileType: String
  fileURL: String
  mimeType: String
  originalName: String
}

# Vendor auth Type

type Vendor {
  _id: String
  email: String
  password: String
  fullName: String
  mobileNumber: String
  country: String
  brand: String
  profilePic: ImageData
  temporaryMobileOtp: MobileOtpData
  isVerified: Boolean
  isBlocked: Boolean
  token: String
  temporaryVendorAuthToken: String
}

type MobileOtpData {
  code: String
  expiresAt: String
}

# Vendor auth Input

input VerifyTempVendorInput {
  temporaryMobileOtp: MobileOtpDataInput
}

input VendorLoginInput {
  email: String!
  password: String!
}

input VendorEditProfileInput {
  fullName: String
  email: String
  password: String
  mobileNumber: String
  country: String
  brand: String
}

input MobileOtpDataInput {
  code: String
  expiresAt: String
}

# Vendor auth Output

type VendorAuthResponse {
  _id: String
  token: String
}

type UpdateVendorResponse {
  _id: String
  message: String
}

type Query {
  getVendorRecord: getVendorRecordResponse
}

type getVendorRecordResponse {
  record: Vendor
}

type VerifyTempVendorResponse {
  _id: String
  message: String
}

# Schema

schema {
  mutation: Mutation
  query: Query
}
