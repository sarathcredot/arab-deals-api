scalar Upload
scalar JSONObject

# Vendor  Mutations

type Mutation {
  createVendor(input: VendorSignUpInput!, image:Upload): CreateVendorResponse!
  createVendorByAdmin(input: VendorSignUpByAdminInput!, image:Upload): CreateVendorByAdminResponse!
  vendorKycApproval(input: VendorKycStatusInput!): VendorKycStatusResponse!
  loginVendor(input: VendorLoginInput!): VendorAuthResponse!
  updateVendorProfile(input: VendorEditProfileInput!,image: Upload): UpdateVendorResponse!
}

# Vendor  Type


type ImageData {
  fileType: String
  fileURL: String
  mimeType: String
  originalName: String
}

type Vendor {
  _id: String
  fullName: String!
  email: String
  mobileNumber: String!
  isBlocked: Boolean
  profilePic:ImageData
  isKycCompleted: Boolean
  brands: [String]
  categories: [String]
}

type VendorWithKycData {
  _id: String
  fullName: String
  email: String
  mobileNumber: String
  isBlocked: String
  isKycCompleted: Boolean
  outletId: String
  outletName: String
  outletStatus: String
  companyId: String
  companyName: String
  companyStatus: String
  profilePic:ImageData
  brands: [String]
  categories: [String]
}

type VendorWithAllKycData {
  _id: String
  fullName: String
  email: String
  mobileNumber: String
  isBlocked: String
  isKycCompleted: Boolean
  outletId: String
  outletName: String
  outletStatus: String
  companyId: String
  companyName: String
  companyStatus: String
}

type VendorWithKycDataStatus {
  _id: String
  isBlocked: String
  isKycCompleted: Boolean
  outletStatus: String
  companyStatus: String
}

type MobileOtpData {
  code: String
  expiresAt: String
}

type ContactPersonData {
  name: String
  phoneNumber: String
  designation: String
}

# Vendor  Input

input VendorSignUpInput {
  fullName: String!
  email: String
  mobileNumber: String!
  isBlocked: Boolean
  isKycCompleted: Boolean
  brands: [BrandRecordIdInput]
  categories: [CategoryRecordIdInput]
}

input VendorSignUpByAdminInput {
  fullName: String!
  email: String
  mobileNumber: String!
  isBlocked: Boolean
  isKycCompleted: Boolean
  brands: [BrandRecordIdInput]
  categories: [CategoryRecordIdInput]
}

input VendorLoginInput {
  email: String!
  password: String!
}

input VendorEditProfileInput {
   _id: String!
  fullName: String
  email: String
  mobileNumber: String
  isKycCompleted: Boolean
  password: String
}

input MobileOtpDataInput {
  code: String
  expiresAt: String
}

input ContactPersonInput {
  name: String!
  phoneNumber: String!
  designation: String!
}

input VendorKycStatusInput {
  _id: String!
  status: Boolean!
}

# Vendor  Output

type VendorAuthResponse {
  _id: String
  token: String
}

type UpdateVendorResponse {
  _id: String
  message: String
}

type VendorKycStatusResponse {
  _id: String,
  message: String
}

type VendorsRecordByAdminResponse {
  record: VendorWithKycData
  message: String
}

type VendorsRecordByVendorResponse {
  record: VendorWithKycData
  message: String
}

type VendorRecordKycStatusResponse {
  record: VendorWithKycDataStatus
  message: String
}

type Query {
  getAllVendorsRecordsByAdmin(input: VendorsRecordsByAdminFilter): VendorsRecordsResponse!
  getVendorRecordByAdmin(input: VendorRecordByAdminInput!): VendorsRecordByAdminResponse!
  getVendorRecordByVendor(input: VendorRecordByVendorInput!): VendorsRecordByVendorResponse!
  getKycStatus(input: VendorRecordKycStatusInput!): VendorRecordKycStatusResponse!
}

# Vendor type

type CreateVendorResponse{
    _id: String
    message: String
    token: String
}

type CreateVendorByAdminResponse{
    _id: String
    message: String
    token: String
}

