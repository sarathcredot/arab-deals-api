scalar Upload
scalar ObjectId
scalar Date


type Mutation {
   createWarrantyClaimRequestByUSer(input:createWarrantyClaimRequestByUSerInput! 
   image: [Upload]):createWarrantyClaimRequestByUSerResponse
   updateClaimStatusByAdmin(input:updateClaimStatusByAdminInput!):updateClaimStatusByAdminResponse
}

type Query {
    getAllClaimRequestsByAdmin(input:getAllClaimRequestsByAdminInput):getAllClaimRequestsByAdminResponse
    getClaimRequestDetailsByAdmin(input:getClaimRequestDetailsByAdminInput!):getClaimRequestDetailsByAdminResponse
}

input warrantyAddressInput{
  firstname: String
  email: String
  mobile: String
#   streetName: String
#   city: String
#   houseNumber: String
  country: String
  postCode: String
#   apartment: String
#   suite: String
#   unit: String
  governorate: String!
  village: String!
  governorateID: String!
  villageID: String!
  address:String
}

input createWarrantyClaimRequestByUSerInput{
    productId:ObjectId!
    claimType:String!
    issueDescription:String
    warrantyAddress:warrantyAddressInput!
}

input getAllClaimRequestsByAdminInput{
    page:Int
    size:Int
    search:String
    claimStatus:String
}

input getClaimRequestDetailsByAdminInput{
    claimRequestId:ObjectId!
}

input updateClaimStatusByAdminInput{
     claimRequestId:ObjectId!
     claimStatus:String!
     Reason:String
     Date:Date
}

type claimUserDetail{
    _id:ObjectId
    displayName:String
}

type warranty{
    name:String
    description:String
    duration:Int
    warrantyType:[String]
}

type claimProductDetail{
    productId:String
    warranty:warranty
    productName:String
    deliveryDate:Date
    shippingStatus:String
    orderDate:Date
    paymentStatus:String
    shippingCharge:Float
    sellingPrice:Float
    shortDescription:String
    paymentMode:String
    vendorId:ObjectId
    itemId:String
    courierId:String
    invoiceNumber:String
    warehouseSkuId:String
}

type claimVendorDetail{
  fullName:String
}

type claimProductsDetail{
  images:[FileData]
}

type warrantyAddress{
  firstname: String
  email: String
  mobile: String
#   streetName: String
#   city: String
#   houseNumber: String
  country: String
  postCode: String
#   apartment: String
#   suite: String
#   unit: String
  governorate: String!
  village: String!
  governorateID: String!
  villageID: String!
  address:String
}


type getClaimRequestDetailsByAdminResponse{
    user:claimUserDetail
    product:claimProductDetail
    vendor:claimVendorDetail
    products:claimProductsDetail
    _id:ObjectId
    createdAt: Date
    issueDescription: String
    order:String
    warrantyId:String
    claimStatus:String
    claimType:String
    claimDate:Date
    rejectedReason:String
    rejectedDate:Date
    productImage:[FileData]
    warrantyAddress:warrantyAddress
}


type createWarrantyClaimRequestByUSerResponse{
   success: Boolean
   message: String
}

type updateClaimStatusByAdminResponse{
   success: Boolean
   message: String
}


type claimUser{
    displayName:String
}

type claimProduct{
    productName:String
    _id:ObjectId
    itemId:String
}

type claimData{
    user:claimUser 
    product: claimProduct
    _id:ObjectId
    productImage:[FileData]
    createdAt: Date
    issueDescription: String
    order:String
    warrantyId:String
    claimStatus:String
    claimType:String
}

type getAllClaimRequestsByAdminResponse{
    success: Boolean
    data: [claimData]
    maxRecords: Int
}


# Schema

schema {
  mutation: Mutation
  query: Query
}
