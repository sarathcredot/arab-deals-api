  email: String
  password: String
  accType: String
  isBlocked: Boolean
  fullName: String
  profilePic: ImageData
}

input AdminSignUpInput {
  email: String!
  password: String!
  fullName: String!
}

input SubAdminSignUpInput {
  email: String!
  password: String!
  isBlocked: Boolean!
  fullName: String!
}

input AdminLoginInput {
  email: String!
  password: String!
}

input AdminEditProfileInput {
  fullName: String
  email: String
  password: String
  isBlocked: Boolean
}

input adminApprovalForVendorInput {
  _id: String!
  isVerified: Boolean
}

type AddAdminResponse {
  _id: String!
}

type AdminAuthResponse {
  _id: String
  token: String
}

type UpdateAdminResponse {
  _id: String
  message: String
}

type getAdminRecordResponse {
  record: Admin
}

type adminApprovalForVendorResponse {
  _id: String
  message: String
}